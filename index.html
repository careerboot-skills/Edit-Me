<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kundali 5Y — Swiss Ephemeris</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8ee;color:#2c2119;font-family:Arial,sans-serif}
header{background:#7f2f16;color:#fff;text-align:center;padding:28px 16px}header h1{margin:0 0 6px}
main{max-width:1050px;margin:auto;padding:18px}.box{background:#fff;border:1px solid #ead7bf;border-radius:16px;padding:20px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #d4c0a7;border-radius:9px;font-size:15px}
button{border:0;border-radius:9px;padding:12px 17px;background:#8f3517;color:white;font-weight:bold;cursor:pointer;margin-top:15px}.secondary{background:#eadcca;color:#2c2119;margin-left:8px}
.note{color:#76685b;font-size:13px;line-height:1.5}.status{padding:10px;border-radius:9px;background:#f5eadb;margin:10px 0}.hidden{display:none}
.pill{display:inline-block;background:#f5eadb;border-radius:20px;padding:7px 10px;margin:4px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid #ead7bf;padding:9px;text-align:left}th{background:#fff4e5}
.chart{max-width:520px;margin:12px auto;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,75px);border:2px solid #b77a2a}.cell{border:1px solid #cdb185;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:3px}.cell strong{display:block}.years{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.year{border:1px solid #ead7bf;border-radius:12px;padding:12px;background:#fffaf5}.year h3{margin:0 0 8px;color:#8f3517}
@media(max-width:760px){.grid,.years{grid-template-columns:1fr}.chart{grid-template-rows:repeat(4,65px)}}
@media print{header,.form,.actions{display:none!important}body{background:#fff}.box{border:0;box-shadow:none}.years{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header><h1>✦ Kundali 5Y</h1><div>Real astronomical calculations • Lahiri Sidereal</div></header>
<main>
<section class="box form">
<h2>Birth Details / जन्म विवरण</h2>
<div class="grid">
<div class="field"><label>Name / नाम</label><input id="name"></div>
<div class="field"><label>Date of Birth / जन्म तारीख</label><input id="dob" type="date"></div>
<div class="field"><label>Time of Birth / जन्म समय</label><input id="tob" type="time"></div>
<div class="field" style="grid-column:1/-1"><label>Birth Place / जन्म स्थान</label>
<div style="display:flex;gap:8px"><input id="place" placeholder="e.g. Kanpur, Uttar Pradesh"><button id="searchPlace" type="button" style="margin-top:0">Find Place / खोजें</button></div>
<div id="placeResults" class="note" style="margin-top:8px"></div></div>
<div class="field"><label>Latitude / अक्षांश</label><input id="lat" type="number" step="0.0001" readonly></div>
<div class="field"><label>Longitude / देशांतर</label><input id="lon" type="number" step="0.0001" readonly></div>
<div class="field"><label>Timezone / UTC offset</label><input id="tz" type="number" step="0.5" readonly></div>
</div>
<button id="generate">Generate Real Kundali / कुंडली बनाएं</button>
<div id="status" class="status">Engine: waiting…</div>
<p class="note">Birth place search करें; app latitude, longitude और timezone automatically भर देगा.</p>
</section>

<section id="result" class="hidden">
<div class="box"><h2 id="title"></h2><div id="summary"></div></div>
<div class="box"><h2>Planetary Positions / ग्रह स्थिति</h2><div id="planets"></div></div>
<div class="box"><h2>Rashi Chart / राशि कुंडली</h2><div id="chart" class="chart"></div></div>
<div class="box"><h2>Next 5 Years / अगले 5 साल</h2><div id="years" class="years"></div></div>
<div class="box actions"><button onclick="window.print()">Download / Save PDF</button><button class="secondary" onclick="window.scrollTo({top:0,behavior:'smooth'})">Edit Details</button></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showPlanets(data){
 let rows='<table><tr><th>Planet</th><th>Sign / राशि</th><th>Degree</th><th>Nakshatra</th><th>House</th><th>Status</th></tr>';
 data.forEach(p=>rows+=`<tr><td>${p.symbol} ${p.name_hi}</td><td>${p.sign_hi}<br>${p.sign}</td><td>${p.degree}</td><td>${p.nakshatra.name_hi} (${p.nakshatra.pada})</td><td>${p.house}</td><td>${p.retrograde?'Retrograde':'Direct'}</td></tr>`);
 $('planets').innerHTML=rows+'</table>';
}
function showChart(data){
 $('chart').innerHTML='';
 data.chart.forEach(h=>{
   const d=document.createElement('div');d.className='cell';
   d.innerHTML=`<div><strong>${h.house}</strong>${h.sign_hi}<br><small>${h.planets.join(', ')}</small></div>`;
   $('chart').appendChild(d);
 });
}
function showYears(data){
 $('years').innerHTML=data.five_years.map(y=>`<div class="year"><h3>${y.year}</h3><b>Career / करियर</b><p>${esc(y.career)}</p><b>Money / पैसा</b><p>${esc(y.money)}</p><b>Relation / रिश्ते</b><p>${esc(y.relation)}</p><small>Jupiter: ${y.jupiter} • Saturn: ${y.saturn}</small></div>`).join('');
}

$('searchPlace').onclick=async()=>{
 const q=$('place').value.trim(), box=$('placeResults');
 if(!q){box.textContent='Birth place लिखें पहले.';return;}
 box.textContent='Searching place… स्थान खोज रहे हैं';
 try{
   const r=await fetch('/api/geocode?q='+encodeURIComponent(q));
   const data=await r.json();
   if(!r.ok) throw new Error(data.error||'Place search failed');
   if(!data.length){box.textContent='Place नहीं मिला. थोड़ा अधिक specific नाम डालें.';return;}
   box.innerHTML=data.map((x,i)=>`<button type="button" class="placePick" data-i="${i}" style="display:block;margin:6px 0;padding:9px;background:#f0e1d0;color:#2c2119;text-align:left;width:100%">${esc(x.display_name)}</button>`).join('');
   document.querySelectorAll('.placePick').forEach(btn=>btn.onclick=()=>{
     const x=data[Number(btn.dataset.i)];
     $('place').value=x.display_name;
     $('lat').value=x.latitude.toFixed(6);
     $('lon').value=x.longitude.toFixed(6);
     $('tz').value=Number(x.timezone).toFixed(2);
     box.textContent=`✓ Location selected • ${x.latitude.toFixed(4)}, ${x.longitude.toFixed(4)} • ${x.timezone_name}`;
   });
 }catch(e){box.textContent='Place search error: '+e.message;}
};

$('generate').onclick=async()=>{
 const status=$('status'); status.textContent='Calculating real ephemeris… कृपया प्रतीक्षा करें';
 const dob=$('dob').value, tob=$('tob').value;
 if(!$('name').value||!dob||!tob||!$('place').value||!$('lat').value||!$('lon').value){
   status.textContent='Please fill Name, DOB, Time and select your Birth Place from search results.';return;
 }
 const [year,month,day]=dob.split('-').map(Number), [hour,minute]=tob.split(':').map(Number);
 try{
   const res=await fetch('/api/kundali',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
     name:$('name').value,place:$('place').value,year,month,day,hour,minute,
     latitude:Number($('lat').value),longitude:Number($('lon').value),timezone:Number($('tz').value)
   })});
   const data=await res.json(); if(!res.ok) throw new Error(data.error||'Calculation failed');
   $('title').textContent=`Kundali for ${data.name} / ${data.name} की कुंडली`;
   $('summary').innerHTML=`<span class="pill">Lagna: ${data.ascendant.sign_hi} / ${data.ascendant.sign}</span><span class="pill">Lagna degree: ${data.ascendant.degree}</span><span class="pill">Nakshatra: ${data.ascendant.nakshatra.name_hi}</span><span class="pill">Lahiri Ayanamsa: ${data.ayanamsa.toFixed(4)}°</span>`;
   showPlanets(data.planets);showChart(data);showYears(data);
   $('result').classList.remove('hidden');status.textContent='Engine: calculation complete ✓';$('result').scrollIntoView({behavior:'smooth'});
 }catch(e){console.error(e);status.textContent='Calculation error: '+e.message;}
};
</script>
</body>
</html>
